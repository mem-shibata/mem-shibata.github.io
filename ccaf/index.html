<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCA-F 英単語カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF5; --paper:#FCFDFF; --ink:#1E2B45; --muted:#65718A; --rule:#CBD8EE;
  --margin:#D5484E; --known:#2F7D5B; --chip:#DCE4F1; --line:#C3CEE0;
  --en:"Literata", Georgia, "Times New Roman", serif;
  --ja:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141B29; --paper:#1D2638; --ink:#E6ECF7; --muted:#9AA6BD; --rule:#2C3850;
  --margin:#E0676C; --known:#5DBB8E; --chip:#27324A; --line:#34415C;
}}
:root[data-theme="dark"]{
  --bg:#141B29; --paper:#1D2638; --ink:#E6ECF7; --muted:#9AA6BD; --rule:#2C3850;
  --margin:#E0676C; --known:#5DBB8E; --chip:#27324A; --line:#34415C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ja);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 48px}
header h1{font-size:1.35rem;font-weight:700;margin:0 0 2px;letter-spacing:.01em}
header p{margin:0;color:var(--muted);font-size:.88rem}
.progress{display:flex;align-items:center;gap:12px;margin:16px 0 18px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--known);width:0;transition:width .3s}
.progress span{font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.85rem}
label.tog{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);margin-left:auto}
:focus-visible{outline:2px solid var(--margin);outline-offset:2px}

/* index card */
.stage{perspective:1400px;margin-top:6px}
.card{position:relative;width:100%;min-height:330px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;background:var(--paper);
  box-shadow:0 1px 0 var(--line),0 10px 28px -14px rgba(20,35,70,.35);
  background-image:linear-gradient(var(--paper) 0 56px, transparent 56px),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  padding:0 26px 22px 64px;display:flex;flex-direction:column}
.face::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.7}
.face::after{content:"";position:absolute;left:0;right:0;top:55px;height:2px;background:var(--margin);opacity:.55}
.back{transform:rotateY(180deg)}
.meta{height:56px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.meta .known-badge{color:var(--known);font-weight:700}
.front-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:20px}
.word{font-family:var(--en);font-weight:600;font-size:clamp(2rem,6vw,2.9rem);line-height:1.15;margin:0;word-break:break-word}
.word.ja{font-family:var(--ja);font-weight:700;font-size:clamp(1.5rem,4.6vw,2.1rem)}
.pos{margin-top:10px;font-size:.85rem;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted);text-align:right}
.back .headline{font-family:var(--en);font-size:1.25rem;font-weight:600;margin:12px 0 0;line-height:32px}
.back .meaning{font-size:1.2rem;font-weight:700;margin:0;line-height:32px}
.back .ex{font-family:var(--en);font-size:1rem;margin:14px 0 0;line-height:32px}
.back .exj{margin:0;color:var(--muted);font-size:.9rem;line-height:32px}
.back .note{margin:10px 0 0;font-size:.85rem;line-height:1.6;padding:8px 10px;border-left:3px solid var(--margin);background:color-mix(in srgb,var(--margin) 8%, transparent)}
.speak{background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.78rem}

.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:16px;align-items:center}
.btn{border:0;border-radius:10px;padding:13px 10px;font-weight:700;font-size:.95rem}
.btn.again{background:var(--chip)}
.btn.got{background:var(--known);color:#fff}
.counter{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;min-width:64px}
.keys{margin-top:10px;font-size:.78rem;color:var(--muted);text-align:center}
.empty{padding:40px 20px;text-align:center;background:var(--paper);border-radius:6px}

/* list */
.search{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin-bottom:10px}
.list{background:var(--paper);border-radius:6px;overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1.1fr);gap:12px;padding:11px 14px;border-bottom:1px solid var(--rule);align-items:start}
.row:last-child{border-bottom:0}
.row .en{font-family:var(--en);font-weight:600}
.row .en small{display:block;font-family:var(--ja);font-weight:400;color:var(--muted);font-size:.75rem}
.row .jp{font-size:.92rem}
.row .jp small{display:block;color:var(--muted);font-family:var(--en);font-size:.82rem;margin-top:2px}
.check{width:20px;height:20px;margin-top:3px;accent-color:var(--known)}
footer{margin-top:28px;font-size:.78rem;color:var(--muted)}
footer a{color:inherit}
[hidden]{display:none!important}
@media (max-width:520px){
  .face{padding-left:52px;padding-right:18px}
  .face::before{left:36px}
  .row{grid-template-columns:24px 1fr}
  .row .jp{grid-column:2}
  label.tog{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>CCA-F 英単語カード</h1>
  <p>公開されている模擬問題の問題文・選択肢から、読解に必要な語を集めました。</p>
</header>
<div class="progress"><div class="bar"><i id="bar"></i></div><span id="prog"></span></div>

<div class="chips" id="chips" role="group" aria-label="カテゴリ"></div>
<div class="controls">
  <div class="seg" role="group" aria-label="表示">
    <button id="vCard" aria-pressed="true">カード</button><button id="vList" aria-pressed="false">一覧</button>
  </div>
  <div class="seg" role="group" aria-label="出題の向き" id="dirSeg">
    <button id="dEn" aria-pressed="true">英 → 日</button><button id="dJa" aria-pressed="false">日 → 英</button>
  </div>
  <button class="ghost" id="shuffle">シャッフル</button>
  <label class="tog"><input type="checkbox" id="onlyNew"> 未習得だけ</label>
</div>

<section id="cardView">
  <div class="stage"><div class="card" id="card" tabindex="0" role="button" aria-label="カードをめくる">
    <div class="face front">
      <div class="meta"><span id="fCat"></span><span id="fKnown"></span></div>
      <div class="front-body"><p class="word" id="fWord"></p><div class="pos" id="fPos"></div></div>
      <div class="hint">タップで裏返す</div>
    </div>
    <div class="face back">
      <div class="meta"><span id="bCat"></span><button class="speak" id="speak" type="button">発音を聞く</button></div>
      <p class="headline" id="bWord"></p>
      <p class="meaning" id="bMean"></p>
      <p class="ex" id="bEx"></p>
      <p class="exj" id="bExj"></p>
      <p class="note" id="bNote"></p>
    </div>
  </div></div>
  <div class="empty" id="empty" hidden>このカテゴリは全部覚えました。「未習得だけ」を外すと復習できます。</div>
  <div class="actions" id="actions">
    <button class="btn again" id="again">まだ</button>
    <div class="counter" id="counter"></div>
    <button class="btn got" id="got">覚えた</button>
  </div>
  <div class="keys">Space で裏返す　← まだ　→ 覚えた　S で発音</div>
</section>

<section id="listView" hidden>
  <input class="search" id="search" type="search" placeholder="英語か日本語で検索">
  <div class="list" id="list"></div>
</section>

<footer>
  出典：SecuSpark、Certification Practice などの無料サンプル問題（非公式）。用語の意味は試験文脈での訳です。覚えた状態はこのブラウザにだけ保存されます。
  <button class="ghost" id="reset" style="margin-top:8px;display:block">覚えた記録をリセット</button>
</footer>
</div>
<script>
const WORDS = [
// ===== 設問の決まり文句 =====
{c:"q",w:"most likely",p:"句",m:"最も可能性が高い",ex:"What is the most likely cause of this behavior?",exj:"この挙動の最も可能性が高い原因は何か？",n:"原因を問う設問の定番。"},
{c:"q",w:"most effective",p:"句",m:"最も効果的な",ex:"Which approach is most effective for reducing false positives?",exj:"誤検知を減らすのに最も効果的な方法はどれか？"},
{c:"q",w:"best fits",p:"句",m:"最もよく合う",ex:"Which tool_choice setting best fits this requirement?",exj:"この要件に最も合う tool_choice 設定はどれか？"},
{c:"q",w:"best practice",p:"名",m:"ベストプラクティス、推奨される方法",ex:"Which error handling approach represents a best practice?",exj:"ベストプラクティスに当たるエラー処理はどれか？"},
{c:"q",w:"recommended approach",p:"名",m:"推奨されるやり方",ex:"What is the recommended approach for this integration?",exj:"この連携で推奨されるやり方は何か？"},
{c:"q",w:"most reliably",p:"副",m:"最も確実に",ex:"Which approach most reliably prevents this misuse?",exj:"この誤用を最も確実に防ぐ方法はどれか？",n:"「確実さ」を問う設問は、プロンプトより仕組み（コード・設定）で強制する選択肢が正解になりやすい。"},
{c:"q",w:"strongest guarantee",p:"名",m:"最も強い保証",ex:"Which option provides the strongest guarantee of valid JSON?",exj:"有効な JSON を最も強く保証するのはどれか？"},
{c:"q",w:"best explains",p:"句",m:"最もよく説明する",ex:"What best explains why the review failed?",exj:"レビューが失敗した理由を最もよく説明するのはどれか？"},
{c:"q",w:"first diagnostic step",p:"名",m:"最初に行う診断手順",ex:"Before restructuring, what is the best first diagnostic step?",exj:"構成を変える前に、最初にすべき診断は何か？",n:"「まず何をすべきか」系。大改修より、まず確認する選択肢が正解になりがち。"},
{c:"q",w:"What should ... do next?",p:"句",m:"次に何をすべきか",ex:"What should the coordinator do next?",exj:"コーディネーターは次に何をすべきか？"},
{c:"q",w:"Which of the following",p:"句",m:"次のうちどれ",ex:"Which of the following is NOT a valid option?",exj:"次のうち有効な選択肢でないのはどれか？",n:"NOT / EXCEPT が大文字で入っていたら否定疑問。読み飛ばし注意。"},
{c:"q",w:"primarily",p:"副",m:"主に",ex:"The agent is primarily responsible for synthesis.",exj:"そのエージェントは主に統合を担当する。"},
{c:"q",w:"without",p:"前",m:"〜せずに",ex:"Enforce the order without redesigning the pipeline.",exj:"パイプラインを作り直さずに順序を強制する。",n:"制約条件を示す重要語。「〜せずに」を見落とすと誤答に引っ張られる。"},
{c:"q",w:"rather than",p:"句",m:"〜ではなく、〜よりむしろ",ex:"It invokes its own searches rather than synthesizing findings.",exj:"結果を統合するのではなく、自分で検索を始めてしまう。"},
{c:"q",w:"instead of",p:"句",m:"〜の代わりに",ex:"It gives vague descriptions instead of citing specific classes.",exj:"具体的なクラス名を挙げる代わりに曖昧な説明をする。"},
{c:"q",w:"regardless of",p:"句",m:"〜に関係なく",ex:"The rule applies regardless of the request type.",exj:"そのルールはリクエストの種類に関係なく適用される。"},
{c:"q",w:"as if",p:"句",m:"まるで〜かのように",ex:"Return results as if all queries succeeded.",exj:"すべてのクエリが成功したかのように結果を返す。",n:"失敗を隠す＝典型的な誤答パターン。"},

// ===== 動詞 =====
{c:"v",w:"mitigate",p:"動",m:"緩和する、軽減する",ex:"Section headers help mitigate the lost-in-the-middle effect.",exj:"見出しは lost-in-the-middle 現象の緩和に役立つ。"},
{c:"v",w:"address",p:"動",m:"（問題に）対処する、取り組む",ex:"Re-run synthesis after the gap is addressed.",exj:"不足部分に対処した後で統合を再実行する。",n:"「住所」ではない。試験では9割こちらの意味。"},
{c:"v",w:"enforce",p:"動",m:"強制する、徹底させる",ex:"The team needs to enforce that extraction always runs first.",exj:"抽出が必ず最初に実行されるよう強制したい。"},
{c:"v",w:"ensure",p:"動",m:"確実にする、保証する",ex:"Ensure consistent date normalization across vendors.",exj:"ベンダー間で日付の正規化を確実に揃える。"},
{c:"v",w:"append",p:"動",m:"末尾に追加する",ex:"Append the tool result to the conversation history.",exj:"ツール結果を会話履歴の末尾に追加する。"},
{c:"v",w:"delegate",p:"動",m:"委任する、任せる",ex:"The coordinator re-delegates targeted follow-up questions.",exj:"コーディネーターが的を絞った追加質問を再委任する。"},
{c:"v",w:"invoke",p:"動",m:"呼び出す、起動する",ex:"The skill loads only when explicitly invoked.",exj:"そのスキルは明示的に呼び出されたときだけ読み込まれる。"},
{c:"v",w:"propagate",p:"動",m:"（上位へ）伝える、伝播させる",ex:"Propagate structured error context to the coordinator.",exj:"構造化されたエラー情報をコーディネーターに伝える。"},
{c:"v",w:"escalate",p:"動",m:"（人間・上位に）引き継ぐ",ex:"The agent escalates the case to a human agent.",exj:"エージェントがケースを人間の担当者に引き継ぐ。"},
{c:"v",w:"resolve",p:"動",m:"解決する",ex:"Resolve the issue autonomously when possible.",exj:"可能なら問題を自律的に解決する。"},
{c:"v",w:"terminate",p:"動",m:"終了させる、打ち切る",ex:"Terminate the entire workflow and report the failure.",exj:"ワークフロー全体を打ち切り、失敗を報告する。",n:"1つの失敗で全体を止める選択肢はたいてい誤答。"},
{c:"v",w:"retrieve",p:"動",m:"取得する",ex:"It successfully retrieves data from two sources.",exj:"2つのソースからはデータ取得に成功する。"},
{c:"v",w:"aggregate",p:"動",m:"集約する、まとめる",ex:"The product aggregates 25 case analyses into one prompt.",exj:"25件の分析を1つのプロンプトに集約する。"},
{c:"v",w:"synthesize",p:"動",m:"統合する、まとめ上げる",ex:"The synthesis agent combines findings into a report.",exj:"統合エージェントが調査結果をレポートにまとめる。",n:"名詞は synthesis（統合）。"},
{c:"v",w:"consolidate",p:"動",m:"1つにまとめる、統合する",ex:"Consolidate both integrations behind one interface.",exj:"両方の連携を1つのインターフェースにまとめる。"},
{c:"v",w:"correlate",p:"動",m:"関連付ける、突き合わせる",ex:"Use custom_id to correlate failures with source documents.",exj:"custom_id を使って失敗と元文書を突き合わせる。"},
{c:"v",w:"diagnose",p:"動",m:"診断する、原因を突き止める",ex:"Use /memory to diagnose inconsistent behavior.",exj:"/memory で挙動の不一致を診断する。"},
{c:"v",w:"verify",p:"動",m:"確認する、検証する",ex:"Verify which memory files are loaded.",exj:"どのメモリファイルが読み込まれているか確認する。"},
{c:"v",w:"validate",p:"動",m:"妥当性を検証する",ex:"The tool validates URLs against the internal domain.",exj:"ツールが URL を社内ドメインと照合して検証する。"},
{c:"v",w:"omit",p:"動",m:"省略する、抜かす",ex:"Claude often omits the suggested fix.",exj:"Claude は修正案をよく書き漏らす。"},
{c:"v",w:"restrict",p:"動",m:"制限する",ex:"Restrict the agent's tools to those relevant to its role.",exj:"エージェントのツールを役割に関係するものに制限する。"},
{c:"v",w:"distinguish",p:"動",m:"区別する",ex:"Examples help distinguish booking from availability checks.",exj:"例を示すと予約と空き確認を区別しやすくなる。"},
{c:"v",w:"decompose",p:"動",m:"分解する",ex:"Decompose the task into smaller subtasks.",exj:"タスクを小さなサブタスクに分解する。"},
{c:"v",w:"generalize",p:"動",m:"一般化する、応用する",ex:"The model generalized the criteria to an unseen pattern.",exj:"モデルは基準を未知のパターンにも応用した。"},
{c:"v",w:"normalize",p:"動",m:"正規化する（形式を揃える）",ex:"Normalize all dates to ISO 8601.",exj:"すべての日付を ISO 8601 形式に揃える。"},
{c:"v",w:"extract",p:"動",m:"抽出する",ex:"Claude extracts line items from scanned invoices.",exj:"Claude がスキャンした請求書から明細を抽出する。"},
{c:"v",w:"trim",p:"動",m:"削る、切り詰める",ex:"Trim the tool output to the relevant fields.",exj:"ツール出力を必要な項目だけに削る。"},
{c:"v",w:"discard",p:"動",m:"捨てる、破棄する",ex:"The hook discards results from other domains.",exj:"フックが他ドメインの結果を破棄する。"},
{c:"v",w:"reject",p:"動",m:"拒否する、却下する",ex:"Reject extractions that fail validation.",exj:"検証に通らない抽出結果を却下する。"},
{c:"v",w:"dismiss",p:"動",m:"（指摘を）却下する、退ける",ex:"Developers can dismiss findings they consider incorrect.",exj:"開発者は誤りと思う指摘を却下できる。"},
{c:"v",w:"flag",p:"動",m:"指摘する、目印をつける",ex:"Flag comments only when they contradict the code.",exj:"コードと矛盾するときだけコメントを指摘する。"},
{c:"v",w:"route",p:"動",m:"振り分ける、回す",ex:"Route uncertain findings to human reviewers first.",exj:"不確かな指摘を先に人間のレビュアーへ回す。"},
{c:"v",w:"prioritize",p:"動",m:"優先する",ex:"Prioritize precision over recall.",exj:"再現率より適合率を優先する。"},
{c:"v",w:"accumulate",p:"動",m:"蓄積する、たまる",ex:"Verbose tool outputs accumulate in the context.",exj:"冗長なツール出力がコンテキストにたまっていく。"},
{c:"v",w:"degrade",p:"動",m:"劣化する、低下する",ex:"Response quality degrades after many lookups.",exj:"何度も検索すると応答品質が落ちる。",n:"名詞 degradation（劣化）もよく出る。"},
{c:"v",w:"anchor",p:"動",m:"（先入観に）引きずる、固定する",ex:"The prior solution anchors the same-session review.",exj:"前の解答が同一セッション内のレビューを引きずる。"},
{c:"v",w:"spawn",p:"動",m:"（子を）生成・起動する",ex:"The coordinator spawns subagents for each topic.",exj:"コーディネーターがトピックごとにサブエージェントを起動する。"},
{c:"v",w:"orchestrate",p:"動",m:"統括する、指揮する",ex:"Orchestrate multi-agent systems with the Agent SDK.",exj:"Agent SDK でマルチエージェントを統括する。"},
{c:"v",w:"conform to",p:"動",m:"〜に準拠する、従う",ex:"The output must conform to a predefined schema.",exj:"出力は事前定義のスキーマに準拠しなければならない。"},
{c:"v",w:"exceed",p:"動",m:"超える",ex:"The documents exceeded context limits.",exj:"文書がコンテキスト上限を超えた。"},

];
const CATS={all:"すべて",q:"設問の決まり文句",v:"動詞",n:"名詞",a:"形容詞・副詞",t:"技術用語"};
const KEY="ccaf-vocab-known-v1";
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){}};
WORDS.forEach((w,i)=>w.id=w.w+"|"+w.c);

let cat="all",dir="en",onlyNew=false,order=[],pos=0,view="card";
const $=id=>document.getElementById(id);

function pool(){return WORDS.filter(w=>(cat==="all"||w.c===cat)&&(!onlyNew||!known.has(w.id)))}
function rebuild(shuffle){
  order=pool();
  if(shuffle){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
  pos=0;render();
}
function renderChips(){
  $("chips").innerHTML=Object.entries(CATS).map(([k,v])=>{
    const n=WORDS.filter(w=>k==="all"||w.c===k).length;
    return `<button class="chip" data-c="${k}" aria-pressed="${k===cat}">${v} ${n}</button>`}).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderChips();rebuild(false);renderList()});
}
function renderProgress(){
  const k=WORDS.filter(w=>known.has(w.id)).length;
  $("bar").style.width=(k/WORDS.length*100)+"%";
  $("prog").textContent=`覚えた ${k} / ${WORDS.length}`;
}
function render(){
  renderProgress();
  const card=$("card");card.classList.remove("flipped");
  const has=order.length>0;
  $("empty").hidden=has;card.parentElement.hidden=!has;$("actions").style.visibility=has?"visible":"hidden";
  if(!has)return;
  if(pos>=order.length)pos=0;
  const w=order[pos];
  $("fCat").textContent=CATS[w.c];$("bCat").textContent=CATS[w.c];
  $("fKnown").innerHTML=known.has(w.id)?'<span class="known-badge">覚えた</span>':"";
  const fw=$("fWord");
  if(dir==="en"){fw.textContent=w.w;fw.classList.remove("ja");$("fPos").textContent=w.p}
  else{fw.textContent=w.m;fw.classList.add("ja");$("fPos").textContent=w.p+"　英語で言うと？"}
  $("bWord").textContent=w.w+"（"+w.p+"）";
  $("bMean").textContent=w.m;
  $("bEx").textContent=w.ex;$("bExj").textContent=w.exj;
  $("bNote").textContent=w.n||"";$("bNote").hidden=!w.n;
  $("counter").textContent=`${pos+1} / ${order.length}`;
}
function flip(){$("card").classList.toggle("flipped")}
function next(mark){
  if(!order.length)return;
  const w=order[pos];
  if(mark===true)known.add(w.id);
  if(mark===false)known.delete(w.id);
  save();
  if(onlyNew&&mark===true){order.splice(pos,1)}else{pos++}
  if(pos>=order.length)pos=0;
  render();renderList();
}
function speak(){
  if(!order.length||!("speechSynthesis" in window))return;
  const w=order[pos];const txt=w.w.replace(/\//g," or ").replace(/·/g,",");
  speechSynthesis.cancel();
  const a=new SpeechSynthesisUtterance(txt);a.lang="en-US";a.rate=.9;
  const b=new SpeechSynthesisUtterance(w.ex);b.lang="en-US";b.rate=.9;
  speechSynthesis.speak(a);speechSynthesis.speak(b);
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderList(){
  const q=$("search").value.trim().toLowerCase();
  const items=WORDS.filter(w=>(cat==="all"||w.c===cat)&&(!onlyNew||!known.has(w.id))&&(!q||(w.w+w.m+w.ex).toLowerCase().includes(q)));
  $("list").innerHTML=items.length?items.map(w=>`<div class="row">
    <input type="checkbox" class="check" data-id="${esc(w.id)}" ${known.has(w.id)?"checked":""} aria-label="${esc(w.w)} を覚えた">
    <div class="en">${esc(w.w)}<small>${w.p}・${CATS[w.c]}</small></div>
    <div class="jp">${esc(w.m)}<small>${esc(w.ex)}</small></div></div>`).join("")
    :'<div class="row" style="display:block;color:var(--muted)">該当する単語がありません。検索語を変えてください。</div>';
  $("list").querySelectorAll(".check").forEach(c=>c.onchange=()=>{c.checked?known.add(c.dataset.id):known.delete(c.dataset.id);save();renderProgress()});
}
function setView(v){view=v;$("vCard").setAttribute("aria-pressed",v==="card");$("vList").setAttribute("aria-pressed",v==="list");
  $("cardView").hidden=v!=="card";$("listView").hidden=v!=="list";$("dirSeg").style.display=v==="card"?"":"none";$("shuffle").style.display=v==="card"?"":"none";
  if(v==="list")renderList();else rebuild(false)}

$("card").onclick=flip;
$("speak").onclick=e=>{e.stopPropagation();speak()};
$("again").onclick=()=>next(false);
$("got").onclick=()=>next(true);
$("shuffle").onclick=()=>rebuild(true);
$("onlyNew").onchange=e=>{onlyNew=e.target.checked;rebuild(false);renderList()};
$("dEn").onclick=()=>{dir="en";$("dEn").setAttribute("aria-pressed",true);$("dJa").setAttribute("aria-pressed",false);render()};
$("dJa").onclick=()=>{dir="ja";$("dJa").setAttribute("aria-pressed",true);$("dEn").setAttribute("aria-pressed",false);render()};
$("vCard").onclick=()=>setView("card");$("vList").onclick=()=>setView("list");
$("search").oninput=renderList;
$("reset").onclick=()=>{if(confirm("覚えた記録をすべて消します。よろしいですか？")){known.clear();save();rebuild(false);renderList()}};
document.addEventListener("keydown",e=>{
  if(view!=="card"||e.target.tagName==="INPUT")return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}
  else if(e.key==="ArrowRight")next(true);
  else if(e.key==="ArrowLeft")next(false);
  else if(e.key==="s"||e.key==="S")speak();
});
renderChips();rebuild(false);
</script>
</body>
</html>
